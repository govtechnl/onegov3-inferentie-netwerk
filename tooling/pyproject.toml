[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onegov3-inferentie-netwerk-tooling"
version = "0.1.0"
description = "Starter tooling for the OneGov #3 challenge 'Overheid Inferentie Netwerk'"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "openapi-spec-validator>=0.7",
]

[tool.setuptools.packages.find]
include = ["inferentienet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
